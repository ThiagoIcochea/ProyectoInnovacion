<div class="admin-integrations-page">

  <div class="page-header">

    <div>

      <span>
        Integraciones
      </span>

      <h1>
        API & Conectores
      </h1>

      <p>
        Gestiona servicios conectados al sistema.
      </p>

    </div>

  </div>

  <div class="integration-grid">

    <div
      class="integration-card"
      *ngFor="let item of integrations">

      <div class="integration-header">

        <h2>
          {{ item.clave }}
        </h2>

        <span
          class="status"
          [class.error]="item.estado === 'INACTIVO'">

          {{ item.estado }}

        </span>

      </div>

      <p>
        Valor actual:
        {{ item.valor }}
      </p>

      <small>
        Tipo:
        {{ item.tipo }}
      </small>

      <div class="actions">

        <button
          class="btn-secondary"
          *ngIf="item.testeable"
          (click)="probarConexion(item)">

          Probar conexión

        </button>

        <button
          class="btn-primary"
          (click)="configurar(item)">

          Configurar

        </button>

      </div>

    </div>

  </div>

</div>
